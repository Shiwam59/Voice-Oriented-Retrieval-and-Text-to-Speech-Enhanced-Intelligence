# fly.toml - VoiceRAG deployment config
app = "voicerag-shiwam59"

[build]

[env]
  LLM_PROVIDER = "ollama"
  OLLAMA_MODEL = "qwen2.5:1.5b"
  OLLAMA_BASE_URL = "http://127.0.0.1:11434"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[vm]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
